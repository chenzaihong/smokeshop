<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>烟酒店工作台 - 离线</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a5276, #2471a3);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            text-align: center;
            padding: 24px;
        }
        .card {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 48px 32px;
            max-width: 360px;
            width: 100%;
        }
        .icon { font-size: 64px; margin-bottom: 16px; }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        p { font-size: 15px; opacity: 0.8; line-height: 1.6; margin-bottom: 24px; }
        .btn {
            display: inline-block;
            background: white;
            color: #1a5276;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }
        .btn:active { transform: scale(0.96); opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>当前离线</h1>
        <p>请检查网络连接后重试。<br>应用会在有网络时自动同步数据。</p>
        <a class="btn" href="javascript:location.reload()">重新连接</a>
    </div>
</body>
</html>
